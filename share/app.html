<!doctype html>
<!-- OmaCar — the workshop.
     One page, no build step, served over http://127.0.0.1 by lib/serve.py.

     Everything here is an ES module loaded straight from disk. There is no
     bundler, no framework and no lockfile, because the thing this replaces is
     a five-thousand-dollar tablet that stops getting updates when its vendor
     decides it should, and a tool you cannot open and repair is the same trap
     in a different colour.

     Layout is a fixed rail, a fixed vehicle bar, and one scrolling view. The
     vehicle identity NEVER leaves the screen: every scan tool that has ever
     shown somebody the wrong car's data got there by letting it. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmaCar</title>
<link rel="icon" href="icon.svg">
<!-- app.css first: every sheet below builds on its tokens, and two of them
     (nav.css, omaplay.css) read custom properties it defines. A sheet that
     loads first sees those as undefined, which does not warn — it silently
     invalidates any calc() using them, and the rule is dropped. That is
     exactly how the bottom tab bar shipped unstyled and unnoticed: nav.css
     was written, was correct, and was never linked here at all. -->
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/replay.css">
<link rel="stylesheet" href="css/car3d.css">
<!-- After app.css: ima.css completes app.css's tint family and builds on its
     tokens, so it has nothing to style against if it loads first. -->
<link rel="stylesheet" href="css/ima.css">
<link rel="stylesheet" href="css/omaplay.css">

<div id="app" class="app" data-booting="1">
  <nav class="rail" aria-label="Sections">
    <button type="button" class="rail-mark" id="btn-hub"
            title="Car dashboard — gauges, codes, radio">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <path d="M12 3v5.6M5.2 16.4l4.5-2.6M18.8 16.4l-4.5-2.6"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="rail-items" id="rail"></div>
    <div class="rail-foot">
      <button type="button" class="rail-btn" id="btn-learn"
              title="Learn mode — explain what everything means"
              aria-pressed="false">Learn</button>
      <button type="button" class="rail-btn" id="btn-privacy"
              title="Hide the VIN and plate, for photographs"
              aria-pressed="false">◉</button>
      <button type="button" class="rail-btn" id="btn-units" title="Toggle units">mi</button>
    </div>
  </nav>

  <header class="vbar" id="vbar"></header>

  <main class="stage" id="stage" tabindex="-1"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-host" id="modal-host" hidden></div>
</div>

<noscript>
  <p style="padding:2rem;font-family:monospace">OmaCar needs JavaScript. Everything
  it shows is also available from the terminal — try <code>omacar doctor</code>.</p>
</noscript>

<script type="module" src="js/main.js"></script>
<!-- Loaded after the app, and separately, because it is not part of any view:
     it holds a screen wake lock while the car is connected or the radio is
     playing, so a drive is not punctuated by reaching over to tap a key. -->
<script type="module" src="js/awake.js"></script>
