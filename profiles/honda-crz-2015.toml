# OmaCar vehicle profile.
#
# confidence:
#   candidate  The ECU answered.
#              Nothing more is known — it may be a constant, a part number, or padding.
#   observed   The bytes were seen to change across samples, so it carries *something*.
#              What it means is still a guess.
#   validated  Checked against something real — a gauge on the dash, a second tool, or a physical change somebody made — and it matched.
#              Safe to drive a display.
#   refuted    Tried and found wrong.
#              Kept deliberately, so nobody spends an hour rediscovering that it does not work.
#
# An entry below `validated` must not drive a gauge.

